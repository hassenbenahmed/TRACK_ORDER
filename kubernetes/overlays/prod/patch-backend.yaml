apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
      - name: trackorder-backend
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        resources:
          requests:
            cpu: "300m"
            memory: "384Mi"
          limits:
            cpu: "800m"
            memory: "768Mi"
