apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trackorder-test

resources:
  - ../../base

patches:
  - path: patch-backend.yaml
  - path: patch-frontend.yaml
  - path: patch-postgres.yaml
  - path: patch-service-frontend.yaml

images:
  - name: trackorder-backend:prod
    newName: trackorder-backend
    newTag: test
  - name: trackorder-frontend:prod
    newName: trackorder-frontend
    newTag: test
