apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trackorder-backend
  template:
    metadata:
      labels:
        app: trackorder-backend
    spec:
      containers:
      - name: trackorder-backend
        image: trackorder-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: trackorder-config
        - secretRef:
            name: trackorder-secret
